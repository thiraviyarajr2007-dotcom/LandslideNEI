<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LandslideNEI EOC Side Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #0a1322;
      border-bottom: 1px solid #1e293b;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand img {
      width: 22px;
      height: 22px;
    }
    .brand-title {
      font-size: 12px;
      font-weight: 700;
      font-family: monospace;
      color: #10b981;
      letter-spacing: 0.05em;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      font-family: monospace;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #334155;
      color: #38bdf8;
    }
    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #020617;
    }
    #offline-notice {
      display: none;
      padding: 16px;
      text-align: center;
      font-family: monospace;
      font-size: 12px;
      color: #cbd5e1;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon32.png" alt="LandslideNEI">
      <div>
        <div class="brand-title">LANDSLIDENEI</div>
        <div style="font-size: 9px; color: #94a3b8; font-family: monospace;">EOC WORKSTATION // SIDE PANEL</div>
      </div>
    </div>
    <div class="controls">
      <button id="btn-reload" title="Refresh Dashboard">🔄 Reload</button>
      <button id="btn-newtab" title="Open full screen in tab">↗️ Full Tab</button>
    </div>
  </header>

  <div id="offline-notice">
    ⚠️ Local API / Dashboard is not reachable at <span id="current-url">http://localhost:8000</span>.<br>
    Please ensure the LandslideNEI server is running (<code style="color: #10b981;">python -m uvicorn api.main:app --port 8000</code>).
  </div>

  <iframe id="dashboard-frame" src="http://localhost:8000/dashboard/"></iframe>

  <script src="sidepanel.js"></script>
</body>
</html>
